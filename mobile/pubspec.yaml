name: livra
description: Livra — Livraison & Transport multi-vendeurs
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # --- Firebase ---
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  # --- Maps & Géolocalisation ---
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  geoflutterfire_plus: any
  # --- Auth locale / biométrie ---
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # --- State management ---
  flutter_riverpod: ^2.6.1
  # --- Cache & stockage local ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  # --- Réseau / API ---
  dio: ^5.7.0
  # --- Images ---
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  # --- UI / UX ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  modal_bottom_sheet: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  go_router: ^14.2.7
  # --- Utilitaires ---
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

# Icônes déjà générées et commitées dans android/app/src/main/res/mipmap-*
# (à partir de assets/images/livra_icon_mark.png). Cette config sert juste à
# les régénérer proprement si le logo change un jour :
# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/livra_icon_mark.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  # Pas de police custom déclarée ici : l'app utilise google_fonts (Inter)
  # via core/theme/app_theme.dart. Si tu veux une police de marque, ajoute
  # les vrais fichiers .ttf dans assets/fonts/ puis un bloc `fonts:` ici.
